name: Update prices

# Quotes only — no analytics. Runs on Oslo Børs trading days, before the open
# and after the close, so the site always shows a price from the last session.
on:
  schedule:
    - cron: "0 6 * * 1-5"    # 08:00 CEST / 07:00 CET — before the 09:00 open
    - cron: "0 16 * * 1-5"   # 18:00 CEST / 17:00 CET — after the close settles
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cadence-data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance numpy pandas

      - name: Refresh prices
        run: python scripts/update_prices.py

      - name: Quality gate
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          cat = json.loads(Path("public/data/catalog.json").read_text())
          px = json.loads(Path("public/data/prices.json").read_text())
          meta = json.loads(Path("public/data/meta.json").read_text())
          known = {str(c["id"]) for c in cat}
          priced = px["p"]
          assert len(cat) > 10000, f"catalog too thin: {len(cat)}"
          assert len(priced) > 5000, f"too few priced instruments: {len(priced)}"
          assert all(v[0] and v[0] > 0 for v in priced.values()), "zero/None price published"
          orphans = [k for k in priced if k not in known]
          assert not orphans, f"{len(orphans)} quotes for instruments not in the catalog"
          print(f"OK: {len(cat)} instruments, {len(priced)} priced, "
                f"prices as of {meta.get('pricesAsOf', 'n/a')}")
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: prices $(date -u +%FT%RZ)"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
