name: Refresh market data

# The heavy one: full catalog + timing analytics for ~5000 instruments, ~50 min
# of Yahoo bandwidth. Weekday/hour edges move slowly, so weekly is plenty —
# update-prices.yml keeps the quotes fresh between runs.
on:
  schedule:
    - cron: "45 3 * * 6"   # Saturday 03:45 UTC, with the week's sessions settled
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cadence-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance numpy pandas lxml

      - name: Fetch Nordnet + Yahoo data
        run: python scripts/fetch_data.py

      - name: Quality gate
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path
          cat = json.loads(Path("public/data/catalog.json").read_text())
          meta = json.loads(Path("public/data/meta.json").read_text())
          px = json.loads(Path("public/data/prices.json").read_text())
          a = list(Path("public/data/a").glob("*.json"))
          assert len(cat) > 10000, f"catalog too thin: {len(cat)}"
          assert len(px["p"]) > 5000, f"too few priced instruments: {len(px['p'])}"
          assert meta["counts"]["funds"] > 500, "funds missing"
          assert len(a) > 400, f"analytics too thin: {len(a)}"
          assert Path("public/data/a/OSEBX.json").exists(), "index analytics missing"
          osebx = json.loads(Path("public/data/a/OSEBX.json").read_text())
          tf3 = osebx["tf"].get("3Y", {})
          assert tf3.get("matrix"), "index heatmap missing"
          if tf3.get("matrixAsOf"):
              print(f"WARNING: index heatmap carried over from {tf3['matrixAsOf']} "
                    "— Yahoo dropped the intraday bars this run")
          print(f"OK: catalog {len(cat)}, analytics {len(a)}")
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: weekly refresh $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
